# Harness Worker Agent Skill — Platform Walkthrough Agent
#
# Registering the walkthrough as a Harness Agent Skill is what turns a demo
# script into shared infrastructure: it is versioned, RBAC-governed, and
# callable by any team from the catalog. A solutions engineer in another region
# invokes the same skill rather than rebuilding the demo.

apiVersion: harness.io/v1
kind: AgentSkill
metadata:
  name: platform-walkthrough-agent
  identifier: platform_walkthrough_agent
  version: 1.0.0
  orgIdentifier: gtm
  projectIdentifier: solutions_engineering
  description: >-
    Runs a live, narrated product walkthrough in a real browser. Reads a product
    document, plans the demo, drives the UI, and answers customer questions
    mid-flight without losing its place.
  labels:
    domain: gtm
    surface: browser-automation
    maturity: ga
  owner: gtm-solutions-engineering
  tags:
    - demo
    - onboarding
    - browser-agent
    - customer-facing

spec:
  triggerPhrases:
    - "run the product walkthrough"
    - "demo {flow} in the {product} tab"
    - "walk this customer through the platform"
    - "show me how {feature} works"

  model:
    provider: anthropic
    # Opus 5 handles the planning pass and the grounded mid-demo Q&A; both are
    # judgement calls in front of a customer, so we do not trade quality here.
    id: claude-opus-5
    maxTokens: 8000
    # NOTE: `temperature` is intentionally absent. It is rejected with a 400 on
    # Opus 5 / Sonnet 5 / Opus 4.7+. Do not reintroduce it on this model.
    thinking:
      type: adaptive
    promptCaching:
      enabled: true
      # The product doc is identical across every narration and Q&A call.
      cacheKeys:
        - product_doc

  inputs:
    - name: product_doc
      type: string
      required: true
      description: >-
        The document this demo is planned and narrated from — an upload id from
        POST /document, or the document text itself. Supplied per run; the skill
        is not bound to any one product.
    - name: demo_focus
      type: string
      required: true
      description: >-
        What to show, in the presenter's own words: "the issue triage flow",
        "how a viewer builds a playlist". Free text, not an enum.
    - name: tab_hint
      type: string
      required: false
      description: >-
        Which of the presenter's open browser tabs to demo in — a product name,
        a host, or a full URL to open. Empty means the foreground tab. The
        navigation allowlist is derived from whatever this resolves to.
    - name: workflow_name
      type: string
      required: false
      description: >-
        Recall a previously planned walkthrough by name instead of re-planning.
    - name: voice_enabled
      type: boolean
      required: false
      default: true
      description: Read narration aloud in the viewer's browser.

  outputs:
    - name: steps_completed
      type: number
    - name: questions_answered
      type: number
    - name: transcript
      type: string
      description: Full narration and Q&A log for post-call follow-up.

  instructions:
    - phase: targeting
      prompt: |
        Attach to the presenter's running Chrome over the DevTools protocol and
        list the open tabs. Pick the one that best answers
        {{ inputs.tab_hint }}. If nothing scores above the match threshold, stop
        and show the tab list — never guess in front of a customer. If the hint
        is a URL rather than a description, open it in a new tab.

        Derive the navigation allowlist from the chosen tab: its host, its
        registrable domain, and nothing else unless EXTRA_ALLOWED_HOSTS says so.

    - phase: planning
      prompt: |
        Read {{ inputs.product_doc }} and the accessibility outline of the page
        that is actually on screen. Produce a 4-6 step walkthrough of
        {{ inputs.demo_focus }} where every step demonstrates one concept from
        the document using controls that exist on that page.

        Emit the plan as structured output matching the StepPlan schema. Use
        only the allowed action vocabulary (navigate, click, fill, press, wait,
        highlight) and address elements by ARIA role plus accessible name —
        never CSS or XPath, and never a selector you did not see in the outline.
        Pre-generate the narration for all steps before execution begins so
        playback never stalls on an API round trip.

    - phase: execution
      prompt: |
        Execute the plan in the selected tab, one step at a time. Emit
        narration, then the actions, then a screenshot of the result. Never
        navigate outside the allowlist derived in the targeting phase. Prefer
        showing over changing: never enter credentials, never change account
        settings, never delete, send, publish, or pay.

    - phase: interruption
      prompt: |
        When a viewer asks a question, freeze execution at the current step
        immediately. Answer in 2-4 sentences using the product document and the
        current screenshot as grounding. If the document does not cover the
        question, say so and offer to follow up — do not speculate.

        Then resume from the exact step you paused on. Never restart the
        walkthrough and never skip the step you were mid-way through.

        If the viewer is steering the demo rather than asking a question
        ("skip to the board", "show labels instead"), re-plan only the
        remaining steps. Completed steps are never replayed.

  runtime:
    type: cloud-container
    image: harness/walkthrough-agent:latest
    resources:
      cpu: 2
      memory: 4Gi
    timeoutMinutes: 20
    healthCheck:
      path: /health
      intervalSeconds: 15

  tools:
    - name: playwright-browser
      type: builtin
      config:
        # Attach to the presenter's own Chrome rather than launching a clean
        # profile: their existing sign-ins are the authentication story, which
        # is why this skill holds no product credentials at all.
        attach:
          protocol: cdp
          url: http://localhost:9222
        # Only used if the attach fails and we fall back to launching.
        engine: chromium
        headless: true
        viewport: { width: 1440, height: 900 }

  governance:
    rbac:
      execute:
        - gtm_solutions_engineering
        - gtm_sales_engineering
      edit:
        - gtm_platform_admins
      publish:
        - gtm_platform_admins
    audit:
      enabled: true
      # Every customer-facing run is replayable after the call.
      capture:
        - plan
        - narration
        - questions
        - answers
        - screenshots
      retentionDays: 90
    allowedDomains:
      # Derived per run from the tab the presenter picked — its host plus its
      # registrable domain. A static list here would either be too narrow to
      # demo anything or wide enough to be meaningless. Add standing exceptions
      # (a shared docs site, an SSO provider) via EXTRA_ALLOWED_HOSTS.
      mode: derived-from-selected-tab
      extra: []
    deniedActions:
      - credential_entry
      - account_settings_change
      - payment
      - destructive_write   # delete, archive, revoke — anything unrecoverable
      - outbound_send       # send, publish, invite, post
    secrets:
      # Values live in the Harness secret manager and are injected at runtime.
      # There is exactly one: product authentication comes from the presenter's
      # attached browser session, never from a stored cookie or password.
      - name: ANTHROPIC_API_KEY
        ref: account.anthropic_api_key
