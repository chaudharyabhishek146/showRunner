# Keeps the deployed backend from being spun down for inactivity.
#
# Render's free tier sleeps a service after ~15 minutes with no traffic, and the
# cold start that follows is 30-60 seconds — which, in a live demo, is the
# customer watching a blank panel while you explain what they should be seeing.
#
# GitHub's scheduler has a 5-minute floor and runs late under load, so a
# `*/2` cron isn't available: each run instead pings on a 2-minute loop until
# the next run takes over. Overlap is harmless, a gap is not.

name: keep-alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: # so you can confirm the URL works without waiting

# A queued run pinging a service the next run is already pinging is pure waste.
concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping the backend every 2 minutes
        env:
          # Defaults to this deployment. Override without touching the file by
          # setting a BACKEND_URL variable under Settings -> Secrets and
          # variables -> Actions -> Variables — useful for a fork or a rename.
          # A default rather than a hard requirement because the failure mode of
          # requiring it is a failed run every five minutes, forever.
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://showrunner-j83q.onrender.com' }}
        run: |
          target="${BACKEND_URL%/}/ping"
          echo "Pinging $target"
          failures=0

          for attempt in 1 2 3; do
            [ "$attempt" -gt 1 ] && sleep 120

            # --max-time 60 rather than a few seconds: if the service *has*
            # gone to sleep, this request is the one paying for the cold start,
            # and giving up on it would defeat the point of the workflow.
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 "$target" || echo "000")
            echo "$(date -u '+%H:%M:%SZ')  ping $attempt -> HTTP $code"
            [ "$code" = "200" ] || failures=$((failures + 1))
          done

          # One bad ping is a blip; three in a row means the deploy is down and
          # this workflow is the only thing watching it.
          if [ "$failures" -ge 3 ]; then
            echo "::error::All 3 pings to $target failed — the backend looks down."
            exit 1
          fi
